title: Token I/O Decoupling
blocks:
  - body:
      kind: markdown
      text: |-
        当前仅维护 Coding 可执行工作流；Multimodal/Mixed 仅作参考。

        ## 适用范围

        适用于 Pi Coding Agent 的 Coding 任务；宿主 Extension 负责流程与调度，MCP 仅提供通用工具，不保存流程状态。

        ## 从这里开始

        ### 已启用 Coding Extension

        消费最新的 **Coding Hooks、revision 和当前检查点**，使用注入包给出的协调工具推进。以扩展状态为准；出现规则歧义、冲突或未覆盖的边界时，定向查详细 owner。

        工具出现不表示已启用。未见当前 Coding Hooks 时，不由 Agent 猜模式或自行调用命令；用户可用 `/coding single <任务>` 或 `/coding multi [数量] <任务>` 显式启用。安装与能力边界见 [Pi Extension 使用说明](../project/PI_EXTENSION.md)。

        ### 未启用 Extension 的回退入口

        读取 [Coding selector](workflows/coding.yaml)，依次建立 Contract、Environment/能力清单、Mode 与 Route Entry，按其选择的单代理或多代理路线执行。沿用 [模式 owner](references/coding/layer-01-fundamental-concepts/delegation/delegation-mode-confirmation.yaml) 的用户选择、四项菜单、默认 Multi/count=1 和会话锁定规则；缺少扩展不授权创建代理，也不免除必需门禁。

        ## 始终有效

        - Root 亲自确认指令、环境、相关代码事实、决策、授权与最终验收；工具、计划、Hash、结构检查和扩展状态均不证明语义正确或授予权限。
        - 绝对禁止 Computer Use：不得用 GUI 控制、鼠标/键盘模拟、为操作控件的截图、辅助功能、窗口/远程桌面自动化，或将其包装为 API、CLI、MCP/子代理绕过。其他真实可用且已授权能力不因本黑名单被禁止。
        - 每项 Coding 默认遵循[共享任务计划生命周期](references/coding/layer-01-fundamental-concepts/execution-planning/task-plan-memory-lifecycle.yaml)：实施/派发前使用获准 Memory、核验 scope/仓库 key、维护累积内容与单写者协调、完成后保全归档；只有用户或更高优先级明确禁止持久化才有例外。能力缺失不是例外，不能回退普通文件。
        - mode/count/allocation/当前 Slice 属于父级会话调度状态，不写入共享计划或其他 Memory。子任务只在真实扩展支持的范围内运行，不假定持久 ID、消息或会话复用。
        - 修改授权不自动包含提交、推送、合并、删除、历史重写、配置或 Memory 写入。只在验收逐项有当前证据时报告 `COMPLETE`，显式列明未执行/不可用检查、风险与未授权效果。

        ## MCP 支持边界

        按实际 Schema 和授权使用 MCP。可选导航或咨询缺失时直接查 owner；必需能力缺失只阻断依赖分支。工具发现、安装及授权边界见 [工作流架构](../project/WORKFLOW_ARCHITECTURE.md) 和 [Pi Extension 使用说明](../project/PI_EXTENSION.md)。

        [Hooks 触发目录](hooks/README.yaml) · [详细工作流架构](../project/WORKFLOW_ARCHITECTURE.md) · [运行时能力边界](references/coding/layer-01-fundamental-concepts/session-runtime/runtime-provider-support.yaml)
