# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: hook-directory
id: readme
markdown_path: hooks/README.md
title: Coding Hooks 触发目录
blocks:
  - intro:
      kind: markdown
      text: |-
        这些文件是由 `extensions/coding-workflow` 的实际 Pi 回调选择并注入的执行合同，**不是仅因文件名叫 Hook 就自动执行的 Markdown**。每份按主题整合相关owner的前置条件、动作、条件分支、禁止项、证据、退出/阻断与重新核验，并逐篇列出“来源—本合同落点”；不是摘要或必须重新通读所有owner才能执行的目录。原owner仍保留权威，冲突/新规则需要定向核验，不能由省略推导豁免。

        用户启动与安装见 [Extension 使用说明](../../project/PI_EXTENSION.md)。不启用 Extension 时，Skill 仍通过 [Coding selector](../workflows/coding.yaml) 定向消费原 owner。

        扩展默认被动。用户启用后，由 [Session 合同](session.yaml#mode-selection) 维护启动顺序、已确认答案和生命周期规则。
  - contracts:
      kind: section
      title: 合同与明确触发
      blocks:
        - contracts-body:
            kind: markdown
            text: |-
              | Hook | 触发条件 | 执行内容 |
              | --- | --- | --- |
              | [foundation](foundation.yaml) | 已启用扩展的每次模型请求 | 共享 Contract、真实来源、授权、禁止 Computer Use、数据与模型边界。 |
              | [entry](entry.yaml) | entry；requirements_changed/capability_changed | 核验任务/约束/验收、实际环境与工具、已选模式及路线。 |
              | [session](session.yaml) | session；能力变化 | 核验当前 Session/角色、模式/预算、实际扩展能力。 |
              | [planning](planning.yaml) | definition 及实施/验证/文档/交付边界；决策/需求变化 | Context/Decision、Memory scope/repo key、默认共享计划、增量保全和单写者。 |
              | [execution](execution.yaml) | execution；Slice/Control 边界 | 放行四字段、精确影响范围、阶段反馈、Continue/Amend/Stop。 |
              | [delegation](delegation.yaml) | multi execution 确认由 Root 执行之前或已选子代理分支、`executor_changed`、VR02 需独立子代理 | 任务/输出资格、唯一职责/预算、一次性调用、结果正文、不重派。 |
              | [context](context.yaml) | definition/documentation/multi execution；context_exchange | Capsule/memo/共享计划区分、获准具名访问、来源与 Handoff。 |
              | [audit](audit.yaml) | session、multi execution、VR02 独立子代理验证、运行中或结果不明的 allocation | 安全摘要偏好、实际结果正文、不可伪造消息/日志。 |
              | [verification](verification.yaml) | verification；文档/Git 回环 | 最终状态、当前 epoch 检查、独立性、类别/结果/缺口。 |
              | [repair](repair.yaml) | VR05 或 `repair_required` | 修复范围门禁、Contract 改变回 Decision、修复后重验。 |
              | [documentation](documentation.yaml) | documentation；documentation_impact | Root/Skill 输出边界、文档影响、检查及原位置恢复。 |
              | [delivery](delivery.yaml) | delivery；git_changed | Git 独立授权、逐标准验收、计划保全/字节相同归档。 |
              | [recovery](recovery.yaml) | paused/blocked/未知效果；生命周期中断 | 准确 owner/位置、实际读回、撤销 Slice、不重放、有限续跑。 |
              | [navigation](navigation.yaml) | entry；当前导航需求 | 可选导航的直接 owner 路径、不伪造未适配服务能力。 |
              | [advisory](advisory.yaml) | advice_requested | 外部建议的最少事实、独立出站授权、API 配置/模型边界。 |
              | [materialization](materialization.yaml) | materialization_requested | 候选预检与真实应用分离、可信身份/grant、守卫失败不绕过。 |

              表中语义条件通过 `coding_checkpoint signal` 上报。宿主不能自动证明任务改变、验证充分、授权真实或 N/A 合理；Agent 负责识别并提供实际来源。工具错误也只自动引导能力/环境核验，不能被重写为可跳过门禁。
  - host-events:
      kind: section
      title: 真正的宿主回调
      blocks:
        - host-events-body:
            kind: markdown
            text: |-
              | Pi 事件 | 扩展执行的动作 |
              | --- | --- |
              | before_agent_start | 保留其他 system prompt sections，仅添加 Coding 简短引导；显式 CLI flag 可从真实用户 prompt 启动。 |
              | context | 替换本扩展旧包，注入当前检查点全文、后续标题和原文链接、有限观察与相关合同，保留其他扩展消息。 |
              | tool_call | 约束内置写入路径/Slice、子代理入口和不透明调用包装；不凭 Shell 关键词或 readOnlyHint 证明安全。 |
              | tool_execution_end | 绑定实际调用证据；已运行写入即使失败也保守失效 epoch；被阻断而未运行的不冒充实际效果。 |
              | session_start | 按真实 Session 与当前 branch 还原位置，核对版本/目录/规则 Hash；不继承另一个 Session 的身份。 |
              | session_tree | 分支位置与会话级已占预算分开恢复，不能把树回退当作文件系统/预算回退。 |
              | session_compact / input / user_bash | 撤销旧 Slice、保留暂停位置，要求按当前事实核验；用户 Shell 影响未知时保守失效。 |
              | agent_before_settle | 仅正常且可继续时有限续跑，最多8次；无检查点进展时停止。 |
              | agent_settled | abort 时暂停并要求读回，不在通知边界启动循环。 |
  - references:
      kind: section
      title: 来源整合与链接基准
      blocks:
        - references-body:
            kind: markdown
            text: |-
              Coding 参考规则由 YAML DSL owner 定义，`references/coding` 提供阅读版。Hook 将规则逐篇映射到运行时动作与证据，执行引用单向指向 DSL owner。目录、索引和逐篇来源对照供导航。Hook 间协作依当前事件与调用边界触发，共用规则直接引用相应 owner。

              - [逐篇来源整合对照](SOURCE_COVERAGE.yaml) 列出 Hook 消费的规则和导航。各合同末尾的“规则来源”表记录具体消费位置。
              - DSL 源引用相对 `.yaml` 文件及块 ID，阅读版引用对应的 `.md` 和标题锚点。Pi 注入时将参考规则链接转换为 `coding-rule:文档#片段`，通过 `coding_checkpoint action=rules` 定向读取。其余本地链接以包内资源为基准生成 `file:` URL。
              - 运行时按需读取编译后的 Hook 正文，注入触发、输入、执行条款、退出及重核。完整合同及“规则来源”对照表在 Markdown 阅读版中查阅。
              - 上下文按模块、当前检查点、执行者、语义信号、恢复状态和 allocation 状态选择 Hook。每个注入包先发共享及适用合同，再发当前状态、当前指令、后续目录和观察。硬上限为 96,000 字符，超限阻断。
              - 两条 Coding 路线提供阶段绑定和返回规则。八份阶段 Hook 维护检查点，扩展从生成索引按需读取当前检查点，后续检查点显示标题。入口上下文组合当前路线的 Mode 边界，验证 Hook 按 ID 读取 Epoch 动作。
              - Hook YAML 的执行要求可用 `rule_include` 块引用参考 DSL 片段，编译时转换为运行时引用。编译器校验目标参考规则与片段。DSL 正文中的链接供定位和按需阅读。
  - maintenance:
      kind: section
      title: 维护与验收
      blocks:
        - maintenance-body:
            kind: markdown
            text: |-
              - `catalog.ts` 用运行时索引核对 16 个 Hook、两条路线的阶段绑定和检查点 ID。Markdown 路径、层级和归属由离线脚本检查。改变检查点或模块形状时同步审阅引擎。
              - `npm run check:hooks` 默认只读。检查 16 份合同及目录和对照表的本地链接、标题锚点、路径与符号链接边界，核对来源引用与对照表，并覆盖两种模式、七个模块、单个及组合信号和暂停状态。检查范围为本地资源。
              - 合同和目录在 `docs/rules/hooks/` 下维护。用 `uv run --locked --script scripts/compile-reference-dsl.py` 生成阅读版和注入正文。调整规则来源后用 `node scripts/check-pi-hooks.mjs --write-coverage` 刷新 YAML 和 Markdown 来源对照。来源表记录归属及落点，执行规则写入正文。
              - `npm test` 还验证跨工作区注入链接、中文/重复标题、坏锚点、源引用缺失、超限拒绝及正文不截断；宿主声明/入口smoke另见使用说明。
              - 覆盖率和 Hash 只说明文本/归属/形状，不证明压缩合同逐条语义等价。详细 owner 保留权威；扩展不是新的授权来源、OS 沙箱或完整静态副作用分析器。
              - 原生/其他扩展工具是否经过当前事件链必须实际核验；不可观测的外部操作通过真实读回与语义信号处理，不伪造自动检测。
              - MCP 仅保留通用 tools 服务；本地 Hooks 测试通过不证明服务端可信身份或受保护物化已配置。
