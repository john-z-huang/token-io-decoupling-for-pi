# yaml-language-server: $schema=../../../../reference.schema.json
schema_version: 1
document_type: fundamental-concept
id: content-memo-lifecycle
markdown_path: references/coding/layer-01-fundamental-concepts/context-exchange/content-memo-lifecycle.md
title: "Worker Content Memo Lifecycle"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本文档定义 Serena Memory Worker memo 的创建、更新、清理和可发现性，不定义 memo 内容、dispatch、handoff 授权或验收。
  - rules:
      kind: section
      title: "通用规范"
      expose: true
      blocks:
        - lifecycle:
            kind: section
            title: "创建、更新与发现"
            expose: true
            blocks:
              - lifecycle-body:
                  kind: markdown
                  text: |-
                    `write_content_memo` 为 true 时，使用 `list_memories` 检查具名条目，并在首次出现可复用状态以及实质里程碑、阻塞、handoff、replacement 或正常退出时，使用 `write_memory` 创建或更新 `context-exchange/workers/<worker-context-id>/content-memo`。只在状态/证据实质变化时更新，不要逐命令记录。父级或后继者只有在已放行指令具名或授权该记录时才能读取；Serena 本身不强制该归属规则。这些记录不另建本地文件索引；名称可通过 Serena Memory 列表发现。

                    Memory 能力失败时必须报告，并阻塞依赖该记录的工作；不得回退为文件写入。遵守 memo 内容契约，不得写成命令日志。
  - pi-guidance:
      kind: section
      title: "Pi Coding Agent 优化指令"
      expose: true
      blocks:
        - pi-guidance-body:
            kind: markdown
            text: |-
              Serena 是可选外部 MCP。需要 Memory 时，通过 Pi codemode 的 `searchTools`、`describeTool`、`describeNamespace` 核实实际工具与 schema，调用时检查 `isError`；hidden 工具不得绕过。确认真实项目绑定及 Memory Schema。Memory 名称、内容、持久化及禁止回退文件、授权隔离和边界均按通用规范；能力缺失只阻塞依赖项。Pi 的 `read`、`edit`、`write`、`bash` 可按授权直接访问文档，不代表 Serena Memory 能力。旧身份上下文不可伪造。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Worker Content Memo](content-memo.yaml) — 定位 memo 内容契约。
              - [Worker Content Memo Dispatch](content-memo-dispatch.yaml) — 定位 memo 开关。
