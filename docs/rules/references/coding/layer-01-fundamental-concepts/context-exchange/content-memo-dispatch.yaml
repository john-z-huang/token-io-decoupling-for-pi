# yaml-language-server: $schema=../../../../reference.schema.json
schema_version: 1
document_type: fundamental-concept
id: content-memo-dispatch
markdown_path: references/coding/layer-01-fundamental-concepts/context-exchange/content-memo-dispatch.md
title: "Worker Content Memo Dispatch"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本文档定义父 Agent 控制的 Serena Memory Worker memo 开关 `write_content_memo`，不定义 memo 内容或生命周期。
  - rules:
      kind: section
      title: "通用规范"
      expose: true
      blocks:
        - section-01:
            kind: section
            title: "Dispatch 开关"
            expose: true
            blocks:
              - section-01-body:
                  kind: markdown
                  text: |-
                    每个已放行 bundle 都必须显式包含 `write_content_memo: true` 或 `false`；Worker 不得自行推断默认值。`true` 启用对 `context-exchange/workers/<worker-context-id>/content-memo` 的写入；`false` 只关闭该 memo。已放行 bundle 中须包含准确 Memory 名称。父级控制开关和名称，但这只是逻辑归属：Serena 不强制 Worker 级访问或只读 ACL。

                    Memory 工具未暴露或未获授权时，报告限制并阻塞依赖 memo 的切片；不得把 memo 物化为文件。其他独立工作可以继续。
  - pi-guidance:
      kind: section
      title: "Pi Coding Agent 优化指令"
      expose: true
      blocks:
        - pi-guidance-body:
            kind: markdown
            text: |-
              Serena 是可选外部 MCP。需要 Memory 时，通过 Pi codemode 的 `searchTools`、`describeTool`、`describeNamespace` 核实实际工具与 schema，调用时检查 `isError`；hidden 工具不得绕过。确认真实项目绑定及 Memory Schema。Memory 名称、内容、持久化及禁止回退文件、授权隔离和边界均按通用规范；能力缺失只阻塞依赖项。Pi 的 `read`、`edit`、`write`、`bash` 可按授权直接访问文档，不代表 Serena Memory 能力。旧身份上下文不可伪造。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Worker Content Memo](content-memo.yaml) — 定位 memo 内容契约。
              - [Worker Content Memo Lifecycle](content-memo-lifecycle.yaml) — 定位更新规则。
              - [Coding Context Exchange Workspace Boundary](context-exchange-workspace-boundary.yaml) — 定位 Memory 逻辑归属规则。
