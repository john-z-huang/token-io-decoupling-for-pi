# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: workflow-route
id: coding-multi-agent
markdown_path: coding-workflows/coding-multi-agent.md
title: Coding 工作流 — Multi-Agent 模式
blocks:
  - overview:
      kind: markdown
      text: |-
        本路线只绑定七个主阶段的 Hook。Pi Coding Agent 根据当前任务、真实工具结果和已核实的证据，在相关动作发生时应用 [Hook 合同](../hooks/README.yaml)。阶段之间传递当前证据，附加 Hook 随条件触发。
  - flowchart:
      kind: section
      title: 工作流路线图
      blocks:
        - flowchart-body:
            kind: markdown
            text: |-
              ```mermaid
              flowchart TD
                  MM01["MM01 入口就绪"]
                  MM02["MM02 Session 就绪"]
                  MM03["MM03 工作定义"]
                  MM04["MM04 Multi-Agent 执行"]
                  MM05["MM05 验证"]
                  MM06["MM06 文档"]
                  MM07["MM07 交付与验收"]
                  DONE["complete"]
                  MM01 -- 适用条件已满足 --> MM02
                  MM02 -- 适用条件已满足 --> MM03
                  MM03 -- 适用条件已满足 --> MM04
                  MM04 -- 适用条件已满足 --> MM05
                  MM05 -- 适用条件已满足 --> MM06
                  MM06 -- 适用条件已满足 --> MM07
                  MM07 -- 验收通过 --> DONE
              ```
  - checkpoints:
      kind: section
      title: 路线顺序检查清单
      blocks:
        - preconditions:
            kind: markdown
            text: |-
              使用已确认的模式进入路线，沿用[共享协议 Hook](../hooks/foundation.yaml)中的授权与证据边界。进入各阶段时核对对应合同，按实际适用性处理合同中的事项。
        - MM01:
            kind: route_step
            title: 入口就绪。
            phase: entry
            hook: entry
            text: |-
              按[入口就绪 Hook](../hooks/entry.yaml)核验。核对当前任务、环境、能力及已确认的路线。
        - MM02:
            kind: route_step
            title: Session 就绪。
            phase: session
            hook: session
            text: |-
              按[Session 就绪 Hook](../hooks/session.yaml)核验。读回当前会话与已确认的启动状态。
        - MM03:
            kind: route_step
            title: 工作定义。
            phase: definition
            hook: planning
            text: |-
              按[工作定义 Hook](../hooks/planning.yaml)核验。明确当前工作、验收条件和允许的影响范围。
        - MM04:
            kind: route_step
            title: Multi-Agent 执行。
            phase: execution
            hook: delegation
            text: |-
              按[Multi-Agent 执行 Hook](../hooks/delegation.yaml)核验。按实际任务判断由主 Agent 执行还是委派。
        - MM05:
            kind: route_step
            title: 验证。
            phase: verification
            hook: verification
            text: |-
              按[验证 Hook](../hooks/verification.yaml)核验。用当前实际状态和证据验证适用的验收条件。
        - MM06:
            kind: route_step
            title: 文档。
            phase: documentation
            hook: documentation
            text: |-
              按[文档 Hook](../hooks/documentation.yaml)核验。判断本次改动的文档影响并处理适用项。
        - MM07:
            kind: route_step
            title: 交付与验收。
            phase: delivery
            hook: delivery
            text: |-
              按[交付与验收 Hook](../hooks/delivery.yaml)核验。核对当前证据及已获授权的交付事项。
  - returns:
      kind: section
      title: 前置补证与恢复
      expose: true
      blocks:
        - returns-body:
            kind: markdown
            text: |-
              前置缺失或过期、任务中断或效果未知时，按[恢复 Hook](../hooks/recovery.yaml)保留原挂起模块和子步骤，读回实际效果并按对应合同补证。满足恢复条件后回到原位置，只继续仍获授权且尚未完成的事项。无法安全恢复时，暂停受影响工作并说明所缺证据或能力。

              需求或能力变化按[入口 Hook](../hooks/entry.yaml)核对受影响条件。需要改变已有决定时查阅[工作定义 Hook](../hooks/planning.yaml)。发现需修复的问题时按[修复 Hook](../hooks/repair.yaml)处理。修复、文档或 Git 操作影响已有证据时，按[验证 Hook](../hooks/verification.yaml)复核受影响维度，再回到原调用位置。
  - mode-boundary:
      kind: section
      title: Mode 边界
      expose: true
      blocks:
        - mode-boundary-body:
            kind: markdown
            text: |-
              使用当前 Session 已确认的 Multi-Agent 模式和锁定的正数 child count。实际委派前按[委派 Hook](../hooks/delegation.yaml)核对独立授权、职责、剩余名额及实际子代理能力，派发后审阅完整结果。
  - related:
      kind: section
      title: 按条件触发的 Hooks
      blocks:
        - related-body:
            kind: markdown
            text: |-
              遇到上下文交接、审计、外部建议或受控物化等事项时，从 [Hook 触发目录](../hooks/README.yaml)读取对应合同。
