# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: hook-contract
id: planning
markdown_path: hooks/planning.md
title: 规划 Hook
activate_on: [definition, requirements_changed, dependencies_changed, capability_changed]
blocks:
  - trigger:
      kind: section
      title: 触发条件
      blocks:
        - trigger-body:
            kind: markdown
            text: |-
              选定路线后规划可执行工作，或任务边界、依赖、角色可用性及验收条件变化时。
  - inputs:
      kind: section
      title: 输入与证据
      blocks:
        - inputs-body:
            kind: markdown
            text: |-
              已确认的任务目标、约束与验收，当前状态，以及确定分工所需的角色描述和宿主能力。
  - execution:
      kind: section
      title: 执行要求
      blocks:
        - execution-body:
            kind: markdown
            text: |-
              1. 按可交付结果拆解任务，标明工作依赖、工作区或路径范围、执行者和返回证据。任务简单时使用简短计划。
              2. 单代理路线由主代理承担全部工作。多代理路线按实际需要，将能满足委派要求、提高效率或改善质量的可交付工作匹配到现有角色。主代理负责关键取舍、协调、集成及最终验收。
              3. 并行执行无阻塞依赖和写入冲突的任务。收集到新证据后更新后续顺序、分工和验收，复用仍有效的结果。子代理数量由当前任务产生，随工作需要动态调整。
  - outputs:
      kind: section
      title: 输出与落点
      blocks:
        - outputs-body:
            kind: markdown
            text: |-
              当前任务和依赖、主代理责任、候选委派、预计交付物与验收条件。计划可在主代理当前任务上下文中维护。
  - exit:
      kind: section
      title: 退出与阻断
      blocks:
        - exit-body:
            kind: markdown
            text: |-
              已确定近期工作、职责和验收办法时继续。委派分支须在实际派发前核实角色、实例和宿主能力。
  - recheck:
      kind: section
      title: 重新核验
      blocks:
        - recheck-body:
            kind: markdown
            text: |-
              工作依赖、资源范围、用户要求、可用角色或决定下一步的结果变化时，只调整受影响的工作。
  - sources:
      kind: section
      title: 规则来源
      blocks:
        - sources-body:
            kind: markdown
            text: |-
              任务与角色匹配见[分配与复用规则](../references/orchestration/delegation-policy.yaml#assignment)。
