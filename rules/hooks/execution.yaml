# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: hook-contract
id: execution
markdown_path: hooks/execution.md
title: 主代理执行 Hook
activate_on: [execution, requirements_changed, dependencies_changed]
blocks:
  - trigger:
      kind: section
      title: 触发条件
      blocks:
        - trigger-body:
            kind: markdown
            text: |-
              单代理执行阶段，或多代理路线中主代理推进自己承担的工作时。
  - inputs:
      kind: section
      title: 输入与证据
      blocks:
        - inputs-body:
            kind: markdown
            text: |-
              当前计划、可执行任务、允许影响的路径和相关前置结果。
  - execution:
      kind: section
      title: 执行要求
      blocks:
        - execution-body:
            kind: markdown
            text: |-
              1. 核实工作依赖和当前获准范围，使用宿主实际支持的工具推进任务。
              2. 记录实际结果、失败和影响后续任务的新证据。变更超出原范围时交回规划；失败或结果未知时查明当前实际效果，再决定恢复。
              3. 依赖就绪后推进下一项工作。多代理路线中，主代理等待委派结果期间可推进独立工作。
  - outputs:
      kind: section
      title: 输出与落点
      blocks:
        - outputs-body:
            kind: markdown
            text: |-
              可供后续任务或验证使用的当前产物、实际操作证据和障碍。
  - exit:
      kind: section
      title: 退出与阻断
      blocks:
        - exit-body:
            kind: markdown
            text: |-
              本项交付可验证时继续。授权缺失或实质前置条件未满足时暂停本项工作。
  - recheck:
      kind: section
      title: 重新核验
      blocks:
        - recheck-body:
            kind: markdown
            text: |-
              任务输入、资源、授权或上游结果变化时重新核对其影响。
  - sources:
      kind: section
      title: 规则来源
      blocks:
        - sources-body:
            kind: markdown
            text: |-
              并行任务边界见[任务和角色匹配](../references/orchestration/delegation-policy.yaml#assignment)。
