# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: hook-contract
id: delegation
markdown_path: hooks/delegation.md
title: 委派 Hook
activate_on: [execution, executor_changed, subagent_status_changed, capability_changed]
blocks:
  - trigger:
      kind: section
      title: 触发条件
      blocks:
        - trigger-body:
            kind: markdown
            text: |-
              多代理路线规划具体派发、续接或替换时，或运行中的子代理、所需角色与能力变化时。
  - inputs:
      kind: section
      title: 输入与证据
      blocks:
        - inputs-body:
            kind: markdown
            text: |-
              当前任务计划、对应角色描述、同角色实例的真实标识和状态、调用参数与能力证据，以及下一项任务的前置结果。
  - execution:
      kind: section
      title: 执行要求
      blocks:
        - execution-body:
            kind: markdown
            text: |-
              1. 按任务需要选择已维护的角色。可选角色为[事实调查](../agents/scout.md)、[方案分析](../agents/planner.md)、[任务实施](../agents/worker.md)、[审查验证](../agents/reviewer.md)与 [Git 操作](../agents/git-operator.md)。以各角色定义的职责和返回证据判断适配性。
              2. 查看该角色在本任务中现有的实例。已有健康实例时，优先向相同标识派发后续任务。需要替换时，必须核实实例上下文过长、不可修复的运行问题或无法可靠续接的异常状态之一。普通结束、等待或并行需求按复用规则处理。
              3. 确定确需首次创建或符合条件替换时，依据任务需要与实际支持的配置自动选择模型和推理强度。Ultra 禁止用于任何创建路径，含默认、继承与替换。无法核实有效档位时暂停该次创建。
              4. 将当前子任务、必要约束和证据、工作边界、返回条件交给选定角色。保留实际调用返回的身份与结果，主代理负责跟进进度、处理交接并按依赖整合结果。
  - outputs:
      kind: section
      title: 输出与落点
      blocks:
        - outputs-body:
            kind: markdown
            text: |-
              子任务、角色、实例标识、可观察状态及已接收证据。发生替换时，记录原因和剩余工作。
  - exit:
      kind: section
      title: 退出与阻断
      blocks:
        - exit-body:
            kind: markdown
            text: |-
              派发或续接以实际回执为准。接收结果后核对交付物是否可用于后续工作；依赖仍未满足时留在受影响分支。
  - recheck:
      kind: section
      title: 重新核验
      blocks:
        - recheck-body:
            kind: markdown
            text: |-
              用户指令、任务需要、实例状态或模型及强度设置变化时重新核对相关条件。
  - sources:
      kind: section
      title: 规则来源
      blocks:
        - sources-body:
            kind: markdown
            text: |-
              查看[委派能力](../references/orchestration/delegation-policy.yaml#capabilities)、[任务和角色匹配](../references/orchestration/delegation-policy.yaml#assignment)、[同角色复用与替换](../references/orchestration/delegation-policy.yaml#reuse)及[模型与推理强度](../references/orchestration/delegation-policy.yaml#model-effort)。
