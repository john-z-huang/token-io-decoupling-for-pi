# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: workflow-route
id: coding-multi-agent
markdown_path: workflows/coding-multi-agent.md
title: 多代理 Coding
blocks:
  - overview:
      kind: markdown
      text: |-
        用户明确要求委派或任务存在适合独立委派的分工时，由主代理保留整体计划、决策、协调和最终验收，按各项工作的实际需求动态派给现有角色。
  - flowchart:
      kind: section
      title: 工作流路线图
      blocks:
        - flowchart-body:
            kind: markdown
            text: |-
              ```mermaid
              flowchart TD
                  MM01[需求确认]
                  MM02[任务规划]
                  MM03[任务执行]
                  MM04[结果验证]
                  MM05[交付]
                  DONE[完成]
                  MM01 --> MM02
                  MM02 --> MM03
                  MM03 --> MM04
                  MM04 --> MM05
                  MM05 --> DONE
              ```
  - checkpoints:
      kind: section
      title: 路线顺序检查清单
      blocks:
        - preconditions:
            kind: markdown
            text: |-
              从路线选择器进入。主代理已识别满足用户要求或带来协调收益的分工，派发前核实各自的依赖、角色和宿主能力。
        - MM01:
            kind: route_step
            title: 需求确认
            phase: entry
            hook: entry
            text: |-
              读取[阶段 Hook](../hooks/entry.yaml)，明确目标、用户约束、交付和验收事实。
        - MM02:
            kind: route_step
            title: 任务规划
            phase: definition
            hook: planning
            text: |-
              读取[阶段 Hook](../hooks/planning.yaml)，按任务依赖和角色描述确定候选委派，主代理保留跨任务决策与集成责任。
        - MM03:
            kind: route_step
            title: 任务执行
            phase: execution
            hook: delegation
            text: |-
              读取[阶段 Hook](../hooks/delegation.yaml)，按需派发、复用同角色实例，收集子任务证据并由主代理集成。
        - MM04:
            kind: route_step
            title: 结果验证
            phase: verification
            hook: verification
            text: |-
              读取[阶段 Hook](../hooks/verification.yaml)，以当前产物和真实检查核对验收条件。
        - MM05:
            kind: route_step
            title: 交付
            phase: delivery
            hook: delivery
            text: |-
              读取[阶段 Hook](../hooks/delivery.yaml)，交付用户要求的结果并说明待完成事项。
  - returns:
      kind: section
      title: 前置补证与恢复
      expose: true
      blocks:
        - returns-body:
            kind: markdown
            text: |-
              需求或依赖改变时回到[路线选择](coding.yaml)或本路线中受影响的规划点。子代理出现中断、失联或结果不明时，先按[恢复 Hook](../hooks/recovery.yaml)核对实际效果与续接能力，再决定后续分工。验证发现问题时，修复后重新核验受影响结果。
  - mode-boundary:
      kind: section
      title: 模式边界
      expose: true
      blocks:
        - mode-boundary-body:
            kind: markdown
            text: |-
              任务数量、角色、开始时机、模型和推理强度随计划演进。后续工作优先派给同角色已有实例；替换仅按[委派合同](../hooks/delegation.yaml)核实的例外办理。主代理同步推进独立工作，汇总实际证据并验收。
  - related:
      kind: section
      title: 按条件触发的 Hooks
      blocks:
        - related-body:
            kind: markdown
            text: |-
              按当前动作查阅[Hook 触发目录](../hooks/README.yaml)，遇到中断或未知效果时读取[恢复 Hook](../hooks/recovery.yaml)。
