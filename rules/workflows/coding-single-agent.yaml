# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: workflow-route
id: coding-single-agent
markdown_path: workflows/coding-single-agent.md
title: 单代理 Coding
blocks:
  - overview:
      kind: markdown
      text: |-
        用户明确要求不创建或不使用子代理，或者任务没有值得独立委派的部分时，主代理自行完成需求分析、计划、执行、验证与交付。
  - flowchart:
      kind: section
      title: 工作流路线图
      blocks:
        - flowchart-body:
            kind: markdown
            text: |-
              ```mermaid
              flowchart TD
                  SM01[需求确认]
                  SM02[任务规划]
                  SM03[任务执行]
                  SM04[结果验证]
                  SM05[交付]
                  DONE[完成]
                  SM01 --> SM02
                  SM02 --> SM03
                  SM03 --> SM04
                  SM04 --> SM05
                  SM05 --> DONE
              ```
  - checkpoints:
      kind: section
      title: 路线顺序检查清单
      blocks:
        - preconditions:
            kind: markdown
            text: |-
              从路线选择器进入。主代理掌握当前用户指令、任务范围和验收条件，在当前会话按任务推进。
        - SM01:
            kind: route_step
            title: 需求确认
            phase: entry
            hook: entry
            text: |-
              读取[阶段 Hook](../hooks/entry.yaml)，明确目标、用户约束、交付和验收事实。
        - SM02:
            kind: route_step
            title: 任务规划
            phase: definition
            hook: planning
            text: |-
              读取[阶段 Hook](../hooks/planning.yaml)，基于依赖、可交付结果和实际权限确定主代理范围。
        - SM03:
            kind: route_step
            title: 任务执行
            phase: execution
            hook: execution
            text: |-
              读取[阶段 Hook](../hooks/execution.yaml)，由主代理亲自完成获准任务，并衔接下一项工作。
        - SM04:
            kind: route_step
            title: 结果验证
            phase: verification
            hook: verification
            text: |-
              读取[阶段 Hook](../hooks/verification.yaml)，以当前产物和真实检查核对验收条件。
        - SM05:
            kind: route_step
            title: 交付
            phase: delivery
            hook: delivery
            text: |-
              读取[阶段 Hook](../hooks/delivery.yaml)，交付用户要求的结果并说明待完成事项。
  - returns:
      kind: section
      title: 前置补证与恢复
      expose: true
      blocks:
        - returns-body:
            kind: markdown
            text: |-
              遇到失败、阻断或结果不明时，按[恢复 Hook](../hooks/recovery.yaml)核对当前状态，只重做受影响步骤。用户补充约束或出现新的分工需求时，重新走[路线选择](coding.yaml)；明确的单代理约束仍然适用。
  - mode-boundary:
      kind: section
      title: 模式边界
      expose: true
      blocks:
        - mode-boundary-body:
            kind: markdown
            text: |-
              主代理亲自承担所有任务和验证。需要独立人员或独立代理的验收条件若无法满足，保留证据并报告缺口。
  - related:
      kind: section
      title: 按条件触发的 Hooks
      blocks:
        - related-body:
            kind: markdown
            text: |-
              按当前动作查阅[Hook 触发目录](../hooks/README.yaml)，遇到中断或未知效果时读取[恢复 Hook](../hooks/recovery.yaml)。
