# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: directory-guide
id: coding-workflow-directory
markdown_path: workflows/README.md
title: Coding 路线目录
blocks:
  - overview:
      kind: markdown
      title: 概览
      expose: true
      text: |-
        两条路线共用需求确认、任务规划、结果验证和交付。执行阶段按模式使用主代理执行或委派合同。
  - entry:
      kind: section
      title: 入口
      expose: true
      blocks:
        - entry-body:
            kind: markdown
            text: |-
              依据[路线选择器](coding.yaml)的当前任务判断进入对应路线。
  - routes:
      kind: section
      title: 路线
      expose: true
      blocks:
        - routes-body:
            kind: markdown
            text: |-
              - [单代理 Coding](coding-single-agent.yaml)
              - [多代理 Coding](coding-multi-agent.yaml)
  - section-01:
      kind: section
      title: 分阶段 Hooks
      expose: true
      blocks:
        - section-01-body:
            kind: markdown
            text: |-
              两条路线依次建立任务范围、规划工作、执行任务、核验结果并交付。阶段内按事实应用[触发合同](../hooks/README.yaml)。发现需求、任务依赖或能力变化时回到受影响阶段。
