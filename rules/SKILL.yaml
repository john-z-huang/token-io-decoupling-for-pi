id: skill-entry
markdown_path: SKILL.md
title: Token I/O Decoupling
blocks:
  - body:
      kind: markdown
      text: |-
        按用户当前指令规划任务、选择主代理与子代理的分工，并按实际进展应用工作流和 Hooks。

        ## 开始

        通过[入口 Hook](hooks/entry.yaml)提取目标、约束、交付物和验收条件，然后使用[路线选择器](workflows/coding.yaml)。

        - 用户明确要求不创建或不委派给子代理，或者任务由主代理独立完成更合适时，使用[单代理路线](workflows/coding-single-agent.yaml)。
        - 用户明确要求委派，或有可独立委派且分工能带来实际收益的工作时，使用[多代理路线](workflows/coding-multi-agent.yaml)。按任务动态选择角色、模型和推理强度，优先复用同角色实例。任何新建或替换的子代理均禁止使用 Ultra 推理强度。

        主代理负责计划、派发、协调和最终验收。按[Hook 目录](hooks/README.yaml)读取当前动作涉及的合同。各角色和任务沿用用户授权与当前权限。涉及委派时，按[委派能力](references/orchestration/delegation-policy.yaml#capabilities)核对实际可用的操作。
front_matter:
  name: token-io-decoupling
  description: >-
    根据用户指令自动拆解 Coding 任务、选择单代理或多代理路线、动态编排主代理与子代理并应用相应 Hooks。
