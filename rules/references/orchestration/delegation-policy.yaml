# yaml-language-server: $schema=../../reference.schema.json
schema_version: 1
id: delegation-policy
markdown_path: references/orchestration/delegation-policy.md
title: 子代理分配与复用规则
blocks:
  - capabilities:
      kind: section
      title: 委派能力
      expose: true
      blocks:
        - capabilities-body:
            kind: markdown
            text: |-
              - 按当前环境真正提供的任务创建、派发、状态查询、等待和停止能力安排工作。核对操作允许的参数、上下文共享范围和实际返回的状态。
              - 根据实际工具合同确认调用是一次性的，还是支持用同一实例标识继续派发。缺少创建、续接或状态核验所需的能力时，按影响调整计划，并继续可独立完成的工作。
  - assignment:
      kind: section
      title: 任务和角色匹配
      expose: true
      blocks:
        - assignment-body:
            kind: markdown
            text: |-
              - 主代理根据可独立交付的工作和真实依赖选择现有角色。每次委派明确目标、必要上下文、工作区与允许读写的路径、交付物、验收证据和返回条件。涉及同一资源的写任务串行执行，或按明确的路径和集成边界隔离。
              - 在本任务上下文关联子任务、角色、真实实例标识、当前职责和可观察状态。一次性委派即使未返回可续接的标识，也按角色保留实际派发回执。只有取得真实实例标识及续接能力时才能记录为可复用实例。
              - 主代理统一处理创建、派发和续接，决定跨任务取舍、整合顺序和最终验收。子代理按接收的任务执行，将实际结果、阻塞及后续分工需求交回主代理。新发现需扩大范围时由主代理更新计划。
  - reuse:
      kind: section
      title: 同角色复用与替换
      expose: true
      blocks:
        - reuse-body:
            kind: markdown
            text: |-
              - 派发前先查本任务的同角色实例。已有健康实例时，延续其真实身份和相关上下文。运行中的任务可等待或安排合适的后续交接。分配更多同角色任务、追求并行、提档或换模型均沿用现有实例或由主代理调整任务顺序。
              - 只有实际证据显示下列任一情形，且工作仍需要该角色时，才可以创建同角色替代实例。
                1. 该实例的上下文已过长，影响继续处理所需内容。
                2. 该实例遇到无法修复的运行问题。
                3. 该实例的运行状态异常，无法可靠续接。
              - 替换前核对原实例、已发生的操作、未决结果和可恢复性，记录适用例外。宿主支持时停止或收束旧实例，给替代实例交接仍有效的事实和剩余授权范围，避免重复修改或其他重复效果。
              - 空闲、正常结束和一次超时本身均不足以作为替换依据。等待超时先核对真实状态。宿主的一次性委派正常返回后，若无法续接该实例，按当前任务重新安排由主代理完成或报告依赖该角色的缺口。
  - model-effort:
      kind: section
      title: 模型与推理强度
      expose: true
      blocks:
        - model-effort-body:
            kind: markdown
            text: |-
              - 主代理在每次需要创建或替换时，按子任务复杂度、错误影响、输入类型、工具需求和验证要求，从当前宿主实际支持的组合自动选择模型与推理强度。角色描述本身不绑定模型或档位。
              - 禁止使用 Ultra 推理强度创建任何子代理，包括替代实例。显式值、宿主默认值和继承值均须满足限制。使用宿主实际接受的值，核对有效组合。默认或继承的强度未核实，且无法显式选择已核实的非 Ultra 档位时，暂停该委派并继续独立工作。
